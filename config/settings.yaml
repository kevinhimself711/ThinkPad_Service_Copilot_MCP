# Modular RAG MCP Server - Configuration
# This is the main configuration file for the MCP Server.
# Edit this file to configure LLM, Embedding, VectorStore, and other services.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "dashscope"  # Options: openai, azure, ollama, deepseek, dashscope
  model: "qwen3.5-flash"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  deployment_name: "qwen3.5-flash"
  azure_endpoint: "https://YOUR_ENDPOINT.openai.azure.com/"
  api_version: "2024-02-15-preview"
  api_key:
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "dashscope"  # Options: openai, azure, ollama, dashscope
  model: "text-embedding-v4"
  dimensions: 1024
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # Azure-compatible settings (azure_endpoint triggers Azure compat mode):
  azure_endpoint: "https://YOUR_ENDPOINT.openai.azure.com/"
  deployment_name: "text-embedding-ada-002"
  api_version: "2024-02-15-preview"
  api_key:
  # OpenAI-specific settings (if provider is openai):
  # api_key: "YOUR_API_KEY_HERE"

# =============================================================================
# Vision LLM Configuration (qwen-vl for image_only FRU removal-step reconstruction, M8.7)
# =============================================================================
vision_llm:
  enabled: false  # Default off: deterministic baselines run without vision. Enable for live vision runs.
  provider: "dashscope"  # Options: dashscope (qwen-vl), openai, azure
  model: "qwen3-vl-plus"  # DashScope vision model (M8.11: upgraded from qwen-vl-max/Qwen2.5-VL; A/B showed 6%->33% on residual figures)
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: ""  # Leave empty; key is read from DASHSCOPE_API_KEY env var. Never commit a real key.
  # Azure-compatible settings (only used when provider is azure):
  azure_endpoint: ""
  deployment_name: ""
  api_version: "2024-02-15-preview"
  max_image_size: 2048  # Max dimension (width/height) for image compression

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: true
  provider: "dashscope"  # Options: none, cross_encoder, llm, dashscope
  model: "qwen3-rerank"
  base_url: "https://dashscope.aliyuncs.com"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true  # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment
